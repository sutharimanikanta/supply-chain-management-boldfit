{% extends "base.html" %} {% block title %}Add Inventory - Boldfit{% endblock %}
{% block content %}
<h2 class="mb-4"><i class="bi bi-boxes"></i> Add Inventory</h2>

<div class="card" style="max-width: 500px">
  <div class="card-body">
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Warehouse</label>
        <select class="form-select" name="warehouse_id" required>
          <option value="">Select Warehouse</option>
          {% for w in warehouses %}
          <option value="{{ w.id }}">{{ w.name }} ({{ w.city }})</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">SKU</label>
        <select class="form-select" name="sku_id" required>
          <option value="">Select SKU</option>
          {% for s in skus %}
          <option value="{{ s.id }}">{{ s.name }} ({{ s.sku_code }})</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Quantity</label>
        <input
          type="number"
          class="form-control"
          name="quantity"
          required
          min="0"
        />
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-check"></i> Save
        </button>
        <a href="/inventory" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
