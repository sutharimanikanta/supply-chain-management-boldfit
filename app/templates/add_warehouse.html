{% extends "base.html" %} {% block title %}Add Warehouse - Boldfit{% endblock %}
{% block content %}
<h2 class="mb-4"><i class="bi bi-building"></i> Add New Warehouse</h2>

<div class="card" style="max-width: 600px">
  <div class="card-body">
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Warehouse Name</label>
        <input
          type="text"
          class="form-control"
          name="name"
          required
          placeholder="e.g., Hyderabad FC"
        />
      </div>
      <div class="mb-3">
        <label class="form-label">Location / Address</label>
        <input
          type="text"
          class="form-control"
          name="location"
          required
          placeholder="e.g., Plot 123, Industrial Area"
        />
      </div>
      <div class="mb-3">
        <label class="form-label">City</label>
        <input
          type="text"
          class="form-control"
          name="city"
          required
          placeholder="e.g., Hyderabad"
        />
      </div>
      <div class="mb-3">
        <label class="form-label">Description (Optional)</label>
        <textarea
          class="form-control"
          name="description"
          rows="3"
          placeholder="Additional details..."
        ></textarea>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-check"></i> Save Warehouse
        </button>
        <a href="/warehouses" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
